name: Feature request
description: Suggest an improvement to this repository.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the need or friction this change would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe your suggested solution.
    validations:
      required: false
